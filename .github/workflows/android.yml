name: Wavey APK 빌드

on:
  push:
    # media-notification은 재생 카드를 시험해 보는 임시 가지다.
    # 여기서 나온 APK는 Actions 탭에서만 받을 수 있고, 폰이 자동으로 받아 가는
    # 최신 릴리스는 건드리지 않는다(아래 "최신 릴리스 갱신"이 main에서만 돈다).
    # 시험이 끝나 main에 합치면 이 줄에서 지운다.
    branches: [main, media-notification]
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: write # 최신 빌드를 릴리스로 올리기 위해 필요

jobs:
  build:
    name: 안드로이드 APK
    runs-on: ubuntu-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 웹 앱 빌드
        run: npm run build

      - name: JDK 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: 웹 빌드 결과를 안드로이드로 복사
        run: npx cap sync android

      # 서명 열쇠가 매번 달라지면 기존 앱 위에 덮어 설치할 수 없다.
      # 고정된 열쇠를 비밀값에서 꺼내 쓴다.
      - name: 서명 열쇠 꺼내기
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 비밀값이 없습니다. 임시 열쇠로 서명되어 덮어 설치가 안 됩니다."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wavey-signing.p12"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # 릴리스 빌드로 만든다. 디버그 빌드는 android:debuggable이 켜져 있어서,
      # 폰을 USB로 연결할 수 있는 사람이 앱 내부와 저장된 데이터를 들여다볼 수
      # 있다. 굳이 열어 둘 이유가 없는 문이다.
      #
      # 서명 열쇠는 디버그와 같은 것을 쓰므로, 이미 깔린 앱 위에 그대로 덮어
      # 설치된다. 지웠다 깔 필요가 없다.
      - name: APK 빌드
        env:
          WAVEY_KEYSTORE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/wavey-signing.p12', runner.temp) || '' }}
          WAVEY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAVEY_BUILD_NUMBER: ${{ github.run_number }}
          WAVEY_BUILD_LABEL: ${{ github.sha }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          # 열쇠가 있으면 app-release.apk, 없으면 서명되지 않은 이름으로 나온다.
          OUT=android/app/build/outputs/apk/release
          if [ -f "$OUT/app-release.apk" ]; then
            cp "$OUT/app-release.apk" wavey.apk
          else
            echo "::error::서명된 APK가 없습니다. 열쇠 비밀값을 확인하세요."
            ls -la "$OUT"
            exit 1
          fi

      # 앱이 "새 버전이 나왔는지" 판단할 때 읽는 작은 쪽지.
      # APK 옆에 같이 올려 두면 별도 서버 없이 업데이트 확인이 된다.
      # versionName은 app/build.gradle이 만드는 값과 똑같이 맞춘다.
      - name: 버전 쪽지 만들기
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          SIZE=$(stat -c%s wavey.apk)
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --argjson versionCode "$BUILD_NUMBER" \
            --arg versionName "1.0.${BUILD_NUMBER} (${SHA_SHORT})" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/wavey.apk" \
            --arg notes "$NOTES" \
            --argjson sizeBytes "$SIZE" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: $notes, sizeBytes: $sizeBytes}' \
            > version.json
          cat version.json

      # 빌드할 때마다 남는 사본 (GitHub 로그인 후 Actions 탭에서 받을 수 있음)
      - name: 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: wavey-apk
          path: |
            wavey.apk
            version.json
          retention-days: 30

      # 폰에서 바로 받을 수 있는 고정 주소를 만들기 위한 릴리스
      - name: 최신 릴리스 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wavey.apk version.json \
            --title "Wavey 최신 빌드" \
            --notes "커밋 ${GITHUB_SHA:0:7} 기준으로 자동 빌드된 APK입니다. 폰 브라우저로 이 페이지를 열어 wavey.apk를 받아 설치하세요." \
            --prerelease
